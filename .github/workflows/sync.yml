name: Sync file to Animate-telegramBot

on:
  push:
    paths:
      - "server/bot.js"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Push file to target repo
        run: |
          git config --global user.name "GokulShaji"
          git config --global user.email "gokulshaji2005@gmail.com"
          git clone https://github.com/<your-username>/<target-repo>.git target
          cp notes.txt target/
          cd target
          git add notes.txt
          git commit -m "Auto-sync notes.txt"
          git push https://<your-username>:${{ secrets.PERSONAL_TOKEN }}@github.com/<your-username>/<target-repo>.git main

